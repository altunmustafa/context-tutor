root = "."
tmp_dir = ".tmp"

[build]
cmd = "go build -o ./.tmp/context-tutor-api ./cmd/api"
entrypoint = ["./.tmp/context-tutor-api"]
include_ext = ["go"]
exclude_dir = [".tmp"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = 1000000000

[log]
time = true

[misc]
clean_on_exit = true
